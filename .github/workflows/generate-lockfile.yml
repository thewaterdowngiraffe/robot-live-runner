name: Generate and Add Package Lock
on:
  push:
    branches:
      - main
      - pre-release
  pull_request:

    types:
        - synchronize
    branches:
      - main
      - pre-release
    # paths:
    #   - 'package.json'

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the updated lockfile back to the PR branch

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }} # Check out the head branch of the PR
      - name: Check if lockfile exists
        id: lock-check
        run: |
          if [ -f package-lock.json ]; then
            echo "cache_type=npm" >> $GITHUB_OUTPUT
          else
            echo "cache_type=" >> $GITHUB_OUTPUT
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: ${{ steps.lock-check.outputs.cache_type }}

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Check for Changes
        id: git-check
        run: |
          git status --porcelain
          echo "changed=$(if [ -n "$(git status --porcelain package-lock.json)" ]; then echo "true"; else echo "false"; fi)" >> $GITHUB_OUTPUT

      - name: Commit and Push package-lock.json
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m "chore: auto-generate package-lock.json"
          git push